name: nexus_mobile
description: "Nexus for iOS and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.2.2
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  cloudinary_flutter: ^1.3.0
  cloudinary_url_gen: ^1.8.0
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  flutter_web_auth_2: ^5.1.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  home_widget: ^0.10.0
  image_picker: ^1.2.2
  intl: ^0.20.3
  live_activities: ^2.4.2
  local_auth: ^3.0.1
  lucide_icons_flutter: ^3.1.24
  material_ui: ^1.6.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  quick_actions: ^1.1.0
  sentry_flutter: ^10.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Bundled so release builds never fetch fonts (see tool/fetch_fonts.py).
  assets:
    - assets/fonts/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/nexus-icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1A090D"
  adaptive_icon_foreground: assets/brand/nexus-icon-foreground-1024.png
  adaptive_icon_monochrome: assets/brand/nexus-icon-foreground-1024.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A090D"
  image: assets/brand/nexus-icon-foreground-1024.png
  android_12:
    color: "#1A090D"
    image: assets/brand/nexus-icon-foreground-1024.png
  fullscreen: false
