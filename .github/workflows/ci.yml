name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tokens are in sync with the generator
        run: |
          dart run tool/gen_tokens.dart
          git diff --exit-code lib/design/tokens.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Tests (goldens are recorded on macOS; Linux text rendering differs)
        run: flutter test --exclude-tags golden

